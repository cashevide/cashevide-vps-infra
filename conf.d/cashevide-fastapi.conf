upstream cashevide_fastapi_backend {
    server cashevide-fastapi-web:8000;
}

server {
    listen 80;
    server_name fastapi.cashevide.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fastapi.cashevide.com;

    ssl_certificate     /etc/nginx/certs/cashevide.pem;
    ssl_certificate_key /etc/nginx/certs/cashevide.key;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    access_log /var/log/nginx/cashevide_fastapi_access.log;
    error_log  /var/log/nginx/cashevide_fastapi_error.log;

    client_max_body_size 10M;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    proxy_read_timeout    300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;

    location / {
        proxy_pass http://cashevide_fastapi_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_header Set-Cookie;
    }
}
